name: Compilar APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publicar la Release de esta etiqueta ya existente (p. ej. v2.0.0). Vacío = solo compilar.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Preparar proyecto
        run: |
          npm install
          node scripts/build-web.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Renombrar
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Matriculas-v$VER.apk"
          echo "VER=$VER" >> $GITHUB_ENV
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$VER" ]; then echo "La etiqueta $TAG no coincide con package.json ($VER)"; exit 1; fi
          echo "TAG=$TAG" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Matriculas-v${{ env.VER }}
          path: Matriculas-v*.apk
      - name: Publicar versión
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Matriculas-v*.apk
          body_path: NOVEDADES.md
